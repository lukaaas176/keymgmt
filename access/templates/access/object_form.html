{% extends "access/base.html" %}
{% block title %}{{ title }} · Schließmatrix{% endblock %}
{% block content %}
<a href="{{ back_url }}" class="text-sm text-slate-500 hover:text-slate-800">&larr; Zurück</a>

<div class="mt-3 max-w-lg">
  <h1 class="h-title text-2xl">{{ title }}</h1>

  <form method="post" class="mt-6 card p-6 space-y-4">
    {% csrf_token %}
    {% if form.non_field_errors %}
    <div class="rounded-lg bg-rose-50 ring-1 ring-rose-200 px-3 py-2 text-sm text-rose-700">
      {{ form.non_field_errors|join:" " }}
    </div>
    {% endif %}
    {% for field in form %}
    <label class="block">
      <span class="text-xs font-medium text-slate-500">{{ field.label }}</span>
      {{ field }}
      {% if field.help_text %}<span class="mt-1 block text-xs text-slate-400">{{ field.help_text }}</span>{% endif %}
      {% if field.errors %}<span class="mt-1 block text-xs text-rose-600">{{ field.errors|join:" " }}</span>{% endif %}
    </label>
    {% endfor %}
    <div class="flex gap-2 pt-2">
      <button type="submit" class="btn-primary">Speichern</button>
      <a href="{{ back_url }}" class="btn-ghost">Abbrechen</a>
    </div>
  </form>
</div>
{% endblock %}

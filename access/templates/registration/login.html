<!doctype html>
<html lang="de" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anmelden · Schließmatrix</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .display { font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif; }
  </style>
</head>
<body class="min-h-full grid place-items-center bg-slate-50 text-slate-700 px-4">
  <div class="w-full max-w-sm">
    <div class="flex items-center justify-center gap-2.5 mb-6">
      <span class="grid place-items-center h-8 w-8 rounded-lg bg-slate-900 text-white">
        <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </span>
      <span class="display text-lg font-semibold tracking-tight text-slate-900">Schließmatrix</span>
    </div>

    <div class="bg-white rounded-xl ring-1 ring-slate-200/80 shadow-sm p-6">
      <h1 class="display text-xl font-semibold text-slate-900">Anmelden</h1>
      <p class="mt-1 text-sm text-slate-500">Bitte melde dich an, um fortzufahren.</p>

      {% if form.errors %}
      <div class="mt-4 rounded-lg bg-rose-50 ring-1 ring-rose-200 px-3 py-2 text-sm text-rose-700">
        Benutzername oder Passwort ist falsch.
      </div>
      {% endif %}

      <form method="post" action="{% url 'login' %}" class="mt-5 space-y-4">
        {% csrf_token %}
        <label class="block">
          <span class="text-xs font-medium text-slate-500">Benutzername</span>
          <input type="text" name="username" autocomplete="username" autofocus required
                 class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 outline-none">
        </label>
        <label class="block">
          <span class="text-xs font-medium text-slate-500">Passwort</span>
          <input type="password" name="password" autocomplete="current-password" required
                 class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 outline-none">
        </label>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit"
                class="w-full inline-flex items-center justify-center rounded-lg px-4 py-2 text-sm font-medium bg-indigo-600 text-white hover:bg-indigo-500 shadow-sm transition">
          Anmelden
        </button>
      </form>
    </div>
    <p class="mt-4 text-center text-xs text-slate-400">Schließanlagen-Verwaltung · AStA</p>
  </div>
</body>
</html>

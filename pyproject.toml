[project]
name = "keymgmt"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.0.6",
    "pdfplumber>=0.11.10",
    "ty>=0.0.64",
]

[project.optional-dependencies]
# Production WSGI server (see nix/ and DEPLOY.md). Pillow ships transitively
# with pdfplumber and is used by the image OCR / PDF-render paths.
server = [
    "gunicorn>=21.2",
    "pillow>=10",
]

[tool.ty.rules]
# Django injects model managers and relation descriptors at runtime; ty does
# not currently apply Django's model metaclass transformations.
unresolved-attribute = "ignore"

[tool.ruff]
extend-exclude = ["access/migrations", "docs/superpowers"]

[tool.ruff.lint.per-file-ignores]
# Django expects mutable declarative metadata on these class bodies.
"access/forms.py" = ["RUF012"]
"access/models.py" = ["RUF012"]
# These are immutable test fixtures despite using mutable container syntax.
"access/tests.py" = ["RUF012"]
